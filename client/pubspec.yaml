name: xcaro
description: A new Flutter project.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  provider: ^6.0.5
  http: ^1.1.0
  web_socket_channel: ^2.4.0
  shared_preferences: ^2.2.1
  flutter_secure_storage: ^9.0.0
  json_annotation: ^4.8.1
  equatable: ^2.0.5
  connectivity_plus: ^5.0.2
  confetti: ^0.7.0
  flame: ^1.15.0
  just_audio: ^0.9.35
  path_provider: ^2.1.1
  dio: ^5.8.0+1
  share_plus: ^10.0.0
  package_info_plus: ^8.0.0
  flutter_svg: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  json_serializable: ^6.7.1
  build_runner: ^2.4.6
  flutter_launcher_icons: ^0.13.0
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/icon/
    - assets/icons/icon.png
    - assets/icons/icon_foreground.png
    - assets/images/stone_black.svg
    - assets/images/stone_white.svg
    - assets/images/board.svg
    - assets/images/win_overlay.svg
    - assets/sounds/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/icon.png"
  adaptive_icon_background: "#1A2035"
  adaptive_icon_foreground: "assets/icons/icon_foreground.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icons/icon.png"
    background_color: "#1A2035"
    theme_color: "#FFD700"
  windows:
    generate: true
    image_path: "assets/icons/icon.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/icons/icon.png"

flutter_native_splash:
  color: "#1A2035"
  image: assets/icons/icon.png
  android: true
  ios: true
  android_12:
    color: "#1A2035"
    image: assets/icons/icon.png
